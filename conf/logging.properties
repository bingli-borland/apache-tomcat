handlers = 1catalina.com.alx.enterprise.logging.AsyncFileHandler, 2localhost.com.alx.enterprise.logging.AsyncFileHandler, 3manager.com.alx.enterprise.logging.AsyncFileHandler, 4host-manager.com.alx.enterprise.logging.AsyncFileHandler, java.util.logging.ConsoleHandler

.handlers = 1catalina.com.alx.enterprise.logging.AsyncFileHandler, java.util.logging.ConsoleHandler

############################################################
# Handler specific properties.
# Describes specific configuration info for Handlers.
############################################################

1catalina.com.alx.enterprise.logging.AsyncFileHandler.level = ALL
1catalina.com.alx.enterprise.logging.AsyncFileHandler.directory = ${catalina.base}/logs
1catalina.com.alx.enterprise.logging.AsyncFileHandler.prefix = catalina.
1catalina.com.alx.enterprise.logging.AsyncFileHandler.maxDays = 90
1catalina.com.alx.enterprise.logging.AsyncFileHandler.encoding = UTF-8

2localhost.com.alx.enterprise.logging.AsyncFileHandler.level = ALL
2localhost.com.alx.enterprise.logging.AsyncFileHandler.directory = ${catalina.base}/logs
2localhost.com.alx.enterprise.logging.AsyncFileHandler.prefix = localhost.
2localhost.com.alx.enterprise.logging.AsyncFileHandler.maxDays = 90
2localhost.com.alx.enterprise.logging.AsyncFileHandler.encoding = UTF-8

3manager.com.alx.enterprise.logging.AsyncFileHandler.level = ALL
3manager.com.alx.enterprise.logging.AsyncFileHandler.directory = ${catalina.base}/logs
3manager.com.alx.enterprise.logging.AsyncFileHandler.prefix = manager.
3manager.com.alx.enterprise.logging.AsyncFileHandler.maxDays = 90
3manager.com.alx.enterprise.logging.AsyncFileHandler.encoding = UTF-8

4host-manager.com.alx.enterprise.logging.AsyncFileHandler.level = ALL
4host-manager.com.alx.enterprise.logging.AsyncFileHandler.directory = ${catalina.base}/logs
4host-manager.com.alx.enterprise.logging.AsyncFileHandler.prefix = host-manager.
4host-manager.com.alx.enterprise.logging.AsyncFileHandler.maxDays = 90
4host-manager.com.alx.enterprise.logging.AsyncFileHandler.encoding = UTF-8

java.util.logging.ConsoleHandler.level = ALL
java.util.logging.ConsoleHandler.formatter = com.alx.enterprise.logging.OneLineFormatter
java.util.logging.ConsoleHandler.encoding = UTF-8


############################################################
# Facility specific properties.
# Provides extra control for each logger.
############################################################

com.alx.enterprise.webtier.core.ContainerBase.[Catalina].[localhost].level = INFO
com.alx.enterprise.webtier.core.ContainerBase.[Catalina].[localhost].handlers = 2localhost.com.alx.enterprise.logging.AsyncFileHandler

com.alx.enterprise.webtier.core.ContainerBase.[Catalina].[localhost].[/manager].level = INFO
com.alx.enterprise.webtier.core.ContainerBase.[Catalina].[localhost].[/manager].handlers = 3manager.com.alx.enterprise.logging.AsyncFileHandler

com.alx.enterprise.webtier.core.ContainerBase.[Catalina].[localhost].[/host-manager].level = INFO
com.alx.enterprise.webtier.core.ContainerBase.[Catalina].[localhost].[/host-manager].handlers = 4host-manager.com.alx.enterprise.logging.AsyncFileHandler

# For example, set the com.alx.enterprise.webtier.util.LifecycleBase logger to log
# each component that extends LifecycleBase changing state:
#com.alx.enterprise.webtier.util.LifecycleBase.level = FINE

# To see debug messages for HTTP/2 handling, uncomment the following line:
#com.alx.enterprise.web.crane.http2.level = FINE

# To see debug messages for WebSocket handling, uncomment the following line:
#com.alx.enterprise.web.websocket.level = FINE
